[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside starlette's TestClient with recent anyio releases.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI declares Form/File/Depends parameters through default values.
ignore = ["B008"]
